<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wajibika Kidigitali – Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:wght@500;600;700;800&display=swap">
<style>
/* VOICE: calm, official, plain-spoken – a public accountability service.
   IDEA: a live working demo – the citizen's phone on one side, WAJIBU's desk on the other.
   PICTURE: an iPhone running a WhatsApp chat with the bot; the staff dashboard is the second picture.
   COLOUR and TYPE: WAJIBU blue + dark blue for staff; WhatsApp's own light/dark colours inside the phone. Urbanist for staff UI, Inter in the phone.
   LAYOUT: top bar with view switch, SW/EN and theme; citizen = phone + demo questions; staff = dark menu + work area. */
:root{color-scheme:light dark;
 --blue:#176FD3;--blue2:light-dark(#0F5BB5,#8EC0FF);--navy:light-dark(#0F2F57,#08182C);--tint:light-dark(#EAF2FC,#16304F);
 --ink:light-dark(#111418,#E8EEF6);--mut:light-dark(#5A6776,#9FB2C8);--line:light-dark(#E3E7EC,#22344D);--bg:light-dark(#F4F6F8,#0B1726);--card:light-dark(#FFFFFF,#122238);
 --field:light-dark(#D5DBE2,#2E4562);--hov:light-dark(#F4F6F8,#18304B);--dark:light-dark(#111418,#E8EEF6);--ondark:light-dark(#FFFFFF,#0B1726);
 --w-bar:light-dark(#F6F6F6,#1F2C34);--w-line:light-dark(#DCDCDC,#2A3942);--w-ink:light-dark(#111B21,#E9EDEF);--w-mut:light-dark(#5B6A72,#8696A0);--w-bg:light-dark(#EFEAE2,#0B141A);
 --w-dot1:light-dark(#E0D7CB,#16232B);--w-dot2:light-dark(#E6DED3,#131F26);--w-in:light-dark(#FFFFFF,#202C33);--w-out:light-dark(#D9FDD3,#005C4B);--w-div:light-dark(#E9EDEF,#2A3942);
 --w-btn:light-dark(#027EB5,#53BDEB);--w-enc:light-dark(#FFEECD,#182229);--w-enct:light-dark(#54656F,#FFD279);--w-chip:light-dark(#FFFFFF,#182229);--w-fld:light-dark(#FFFFFF,#2A3942);
 --w-green:light-dark(#008069,#00A884);--w-num:light-dark(#E7F8F1,#103529);--w-numt:light-dark(#00684F,#25D366);--w-tr:light-dark(#BDE5B4,#0F7A64);--w-sel:light-dark(#D8FDD2,#103529)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Urbanist,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{color:var(--ink);background:var(--card)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #6FA8EC;outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;padding:12px max(3vw,16px);background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand i{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px}
.brand small{display:block;font-weight:600;font-size:12.5px;color:var(--mut)}
.seg{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--bg);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;min-height:40px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
.tools{display:flex;gap:10px;align-items:center}
.ghost{border:1px solid var(--line);background:var(--card);min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;margin-left:6px}
.seg button.on .badge{background:#fff;color:#0F5BB5}
/* citizen */
.cit{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:28px max(3vw,16px) 48px;max-width:1240px;margin:0 auto}
.phone{width:393px;height:852px;flex:none;border-radius:64px;background:linear-gradient(145deg,#3a3d42,#17181b 40%,#2a2c30);padding:11px;box-shadow:0 0 0 1px #000,0 40px 80px -30px rgba(0,0,0,.55),inset 0 0 0 2px #55585e;position:relative}
.screen{position:relative;height:100%;border-radius:53px;overflow:hidden;background:var(--w-bar);display:flex;flex-direction:column;font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--w-ink)}
.screen button{color:var(--w-ink)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:9}
.sbar{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 44px;font-weight:600;font-size:16px;background:var(--w-bar);color:var(--w-ink)}
.sbar span{display:flex;gap:6px;align-items:center}.sbar svg{fill:currentColor}
.wh{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px 10px 4px;background:var(--w-bar);border-bottom:1px solid var(--w-line)}
.wh .bk{display:flex;align-items:center;border:0;background:none;padding:6px 2px;font-size:16px;font-weight:500;min-height:44px}
.av{overflow:hidden;width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:Urbanist;font-weight:800;font-size:18px;flex:none}
.wh .nm{flex:1;line-height:1.2;border:0;background:none;text-align:left;padding:4px;display:flex;flex-direction:column}
.wh .nm b{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:600}.wh .nm span{font-size:12.5px;color:var(--w-mut)}
.wh .nm span.ty{color:var(--w-green);font-weight:600}
.ic{border:0;background:none;width:40px;height:44px;display:grid;place-items:center;padding:0;flex:none}
.chat{flex:1;min-height:0;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px;background-color:var(--w-bg);background-image:radial-gradient(var(--w-dot1) 1.1px,transparent 1.3px),radial-gradient(var(--w-dot2) 1px,transparent 1.2px);background-size:22px 22px;background-position:0 0,11px 11px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.day{align-self:center;background:var(--w-chip);border-radius:8px;padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--w-mut);margin:6px 0;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.enc{align-self:center;max-width:90%;background:var(--w-enc);border-radius:8px;padding:7px 12px;font-size:12.5px;line-height:1.4;color:var(--w-enct);text-align:center;margin-bottom:6px}
.b{max-width:84%;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);font-size:15.5px;line-height:1.42;animation:pop .22s ease-out both;overflow:hidden}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.b .tx{padding:7px 9px 5px 10px}
.b .tm{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--w-mut);display:inline-flex;gap:3px;align-items:center}
.b .tx::after{content:"";display:block;clear:both}
.me{align-self:flex-end;background:var(--w-out)}
.bot,.staff{align-self:flex-start;background:var(--w-in)}
.first.me{border-top-right-radius:0;margin-top:5px}.first.bot,.first.staff{border-top-left-radius:0;margin-top:5px}
.staff{outline:1.5px solid var(--blue);outline-offset:-1.5px}
.who{display:block;font-size:13px;font-weight:700;color:var(--blue2);margin-bottom:2px}
.wide{width:84%}
.bb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;border:0;border-top:1px solid var(--w-div);background:var(--w-in);font-weight:600;font-size:15px}
.screen .bb{color:var(--w-btn)}
.bb:hover{filter:brightness(.97)}
.src{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:7px;border-top:1px solid var(--w-div);font-size:12.5px;color:var(--w-mut)}
.nl{display:flex;flex-direction:column;gap:5px;margin:8px 0 2px}
.nl>span{display:flex;gap:8px;align-items:flex-start}.nl>span>span{display:block;flex:1;min-width:0}.nl b.n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--w-num);color:var(--w-numt);display:grid;place-items:center;font-size:12px}
.vn{display:flex;align-items:center;gap:8px;min-width:220px}
.pl{width:36px;height:36px;border:0;border-radius:50%;background:none;display:grid;place-items:center;padding:0}
.screen .pl{color:var(--w-mut)}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.wave i{width:3px;border-radius:2px;background:var(--w-mut);opacity:.5;flex:none}
.wave.play i{animation:wv 1s infinite ease-in-out;opacity:1;background:#3B9E8B}.wave i.f{opacity:1;background:#3B9E8B}
@keyframes wv{50%{transform:scaleY(.4)}}
.tr{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--w-tr);font-size:14px;color:var(--w-mut)}
.ah{display:block;margin:-7px -9px 8px -10px;padding:12px 14px;background:var(--blue);color:#fff}
.ah small{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ah b{display:block;font-size:17px;margin-top:4px;line-height:1.25}
.media{display:block;margin:-4px -6px 6px;border-radius:6px;overflow:hidden;line-height:0}
.doc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.05);margin-bottom:4px}
.doc i{width:36px;height:42px;border-radius:6px;background:#E5544B;color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.map{display:block;height:120px;margin:-4px -6px 6px;border-radius:6px;background-color:light-dark(#DDE9D6,#1E3326);background-image:linear-gradient(light-dark(#fff8,#fff2) 2px,transparent 2px),linear-gradient(90deg,light-dark(#fff8,#fff2) 2px,transparent 2px);background-size:28px 28px;position:relative}
.map::after{content:"";position:absolute;left:50%;top:44%;width:22px;height:22px;margin:-22px 0 0 -11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#E5544B;box-shadow:0 0 0 4px #fff6}
.dots{display:inline-flex;gap:4px;padding:4px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--w-mut);animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{40%{opacity:1}0%,80%,100%{opacity:.3}}
.wi{flex:none;display:flex;align-items:center;gap:4px;padding:7px 8px 6px 4px;background:var(--w-bar);border-top:1px solid var(--w-line)}
.wi form{flex:1;display:flex}
.fld{flex:1;display:flex;align-items:center;min-height:38px;border-radius:20px;background:var(--w-fld);border:1px solid var(--w-line);padding:0 4px 0 14px}
.fld input{flex:1;border:0;outline:none;background:none;font:inherit;font-size:16px;color:var(--w-ink);min-height:36px}
.fld .ic{width:34px;height:36px}
.go{width:38px;height:38px;border-radius:50%;background:#00A884;border:0;display:grid;place-items:center;flex:none}
.screen .go{color:#fff}
.emo{flex:none;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;background:var(--w-bar);border-top:1px solid var(--w-line)}
.emo button{border:0;background:none;font-size:23px;min-height:40px;border-radius:8px}.emo button:hover{background:var(--w-line)}
.home{flex:none;height:26px;background:var(--w-bar);display:grid;place-items:center}.home i{width:134px;height:5px;border-radius:3px;background:var(--w-ink)}
.sheet{position:absolute;inset:0;z-index:7;background:rgba(11,20,26,.5);display:flex;align-items:flex-end}
.sheet>div{width:100%;background:var(--w-bar);border-radius:16px 16px 0 0;padding:8px 0 30px;animation:up .22s ease-out;max-height:88%;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.b,.sheet>div{animation:none}.wave.play i,.dots i{animation:none}}
.sheet .gr{width:36px;height:5px;border-radius:3px;background:var(--w-line);margin:0 auto 6px}
.sheet h3{margin:0;padding:8px 18px 10px;font-size:17px;text-align:center}
.it{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;border-top:1px solid var(--w-div);background:none;padding:11px 20px;text-align:left}
.it b{font-size:16px;font-weight:600}.it span{font-size:13.5px;color:var(--w-mut)}
.att{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 16px 4px}
.att button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500}
.att button i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
/* in-phone pages */
.pg{flex:1;min-height:0;overflow-y:auto;background:var(--w-bar)}
.lt{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 4px 18px}
.lt b{font-size:30px;font-weight:700;letter-spacing:-.5px}
.srch{margin:6px 16px 10px;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:10px;background:var(--w-fld);color:var(--w-mut)}
.srch input{flex:1;border:0;outline:none;background:none;font:inherit;font-size:16px;color:var(--w-ink)}
.fch{display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap}
.fch button{min-height:32px;padding:0 14px;border:0;border-radius:999px;background:var(--w-fld);font-size:14px;font-weight:600;color:var(--w-mut)}
.fch button.on{background:var(--w-sel);color:var(--w-ink)}
.cr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 16px}
.cr:hover{background:var(--w-line)}
.cr .bd2{flex:1;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--w-line);padding-bottom:9px}
.cr .r1,.cr .r2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cr b{font-size:16px;font-weight:600;display:flex;gap:4px;align-items:center}.cr .r2 span{font-size:14px;color:var(--w-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr em{font-style:normal;font-size:12.5px;color:var(--w-mut)}.cr em.u{color:var(--w-green);font-weight:600}
.ub{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--w-green);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.tabs{flex:none;display:flex;border-top:1px solid var(--w-line);background:var(--w-bar);padding:6px 0 2px}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;min-height:50px;color:var(--w-mut)}
.screen .tabs button.on{color:var(--w-ink)}.tabs button.on svg{color:var(--w-green)}
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 16px 12px;text-align:center}
.prof .av{width:96px;height:96px;font-size:42px}
.pa{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
.pa button{border:0;background:var(--w-fld);border-radius:12px;min-width:82px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.screen .pa button{color:var(--w-green)}
.pl2{margin:10px 14px;background:var(--w-fld);border-radius:12px;overflow:hidden}
.pl2 .pr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--w-line);font-size:15px;text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;background:none}
.pl2 .pr:first-child{border-top:0}.pl2 .pr small{display:block;color:var(--w-mut);font-size:13px}
.screen .pr.red{color:#E5544B}
.callv{position:absolute;inset:0;z-index:8;background:radial-gradient(circle at 50% 30%,#1F3A4D,#0B141A 70%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:96px 24px 60px;text-align:center}
.callv .av{width:110px;height:110px;font-size:48px;margin:18px 0 12px}
.callv h3{margin:0;font-size:26px;font-weight:600}.callv p{margin:6px 0 0;color:#C9D4DA;font-size:16px;min-height:48px}
.cb{margin-top:auto;display:flex;gap:22px}
.screen .cb button{width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.screen .cb button.on{background:#fff;color:#0B141A}.screen .cb button.end{background:#E5544B}
/* demo panel */
.demo{flex:1 1 380px;max-width:560px;display:flex;flex-direction:column;gap:18px}
.demo h1{margin:0;font-size:clamp(28px,3.4vw,40px);line-height:1.08;text-wrap:balance}
.demo p.lead{margin:0;color:var(--mut);font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{margin:0 0 4px;font-size:17px}.card .sub{font-size:14px;color:var(--mut);margin:0 0 12px}
.qs{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px;font-weight:600;font-size:15px}
.q:hover{border-color:var(--blue);background:var(--tint)}
.q .tg{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue2);background:var(--tint);border-radius:999px;padding:3px 9px;white-space:nowrap}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.note,.samp{font-size:13px;color:var(--mut)}
/* staff */
.stf{display:flex;flex-wrap:wrap;min-height:calc(100dvh - 66px)}
.side{flex:1 1 236px;max-width:100%;background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.who2{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-size:14px}
.who2 i{width:36px;height:36px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.who2 small{display:block;color:#A9C3E3;font-size:12.5px}
.side button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:none;color:#DCE6F2;font-weight:600;font-size:15px;text-align:left}
.side button:hover{background:rgba(255,255,255,.08)}
.side button.on{background:var(--blue);color:#fff;font-weight:700}
.side button .badge{margin-left:auto;background:rgba(255,255,255,.16)}.side button.on .badge{background:#fff;color:#0F5BB5}
.side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:#A9C3E3}
.work{flex:999 1 560px;padding:28px clamp(16px,3vw,36px) 48px;display:flex;flex-direction:column;gap:20px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.hd h1{margin:0;font-size:28px;line-height:1.1}.hd p{margin:4px 0 0;color:var(--mut);font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi span{font-size:14px;font-weight:600;color:var(--mut)}.kpi b{display:block;font-size:clamp(26px,3vw,34px);font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
.kpi small{font-size:13px;color:var(--mut)}
.kpi.hero{background:var(--blue);border-color:var(--blue);color:#fff}.kpi.hero span,.kpi.hero small{color:#fff}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.28);margin:8px 0 6px;overflow:hidden}.meter i{display:block;height:100%;background:#fff;border-radius:99px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;margin-top:16px;border-bottom:1px solid var(--field)}
.bars i{flex:1;background:light-dark(#9EC3EE,#2B5C93);border-radius:5px 5px 0 0}.bars i:last-child{background:var(--blue)}
.ax{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.hb{display:grid;grid-template-columns:minmax(0,150px) 1fr 52px;gap:12px;align-items:center;font-size:14.5px;margin-top:10px}

  if(SAMPLE){try{const p=`You answer citizens of Tanzania by SMS for WAJIBU (Wajibika Kidigitali). Answer ONLY from KNOWLEDGE. Reply ONLY in ${W?'Kiswahili':'English'}, plain text, no markdown, at most 300 characters, very simple words. If KNOWLEDGE has no answer, say politely you do not have approved information yet and the question was saved for WAJIBU. If it is not about public money or local government, say politely you can only help with council budgets, CAG reports, procurement and reporting corruption. Never offer to connect them to a person.\n\nKNOWLEDGE\n${kbText()}\n\nQUESTION: """${q}"""\n\nReply with JSON only: {"type":"answer"|"handover"|"out_of_scope","text":"..."}`;
    let r=await SAMPLE.json(p,{cache:false});if(typeof r==='string')r=JSON.parse(r);if(r&&r.text){ans=r.text.replace(/\*\*/g,'');if(r.type==='handover')fpCase(q)}}catch(_){}}
  if(!ans){const k=q.toLowerCase();
    if(/cag|ukaguzi|hati|audit/.test(k))ans=W?'Ripoti za CAG 2024/25: hati 1,326 kati ya 1,339 (99%) zinaridhisha. Hati yenye shaka ina maana fedha nyingi hazikuwa na maelezo ya kutosha.':'CAG 2024/25: 1,326 of 1,339 audits (99%) were clean. A qualified opinion means some money was not well explained.';
    else if(/kilosa/.test(k)&&/bajeti|budget|pesa|fedha/.test(k))ans=W?'Bajeti ya Kilosa DC 2026/27 (mfano) ni shilingi bilioni 61 na milioni 200. Mishahara bilioni 38 na milioni 400, miradi bilioni 18 na milioni 700.':'Kilosa DC budget 2026/27 (sample) is 61 billion 200 million shillings. Salaries 38 billion 400 million, projects 18 billion 700 million.';
    else if(/bajeti|budget|pesa|fedha/.test(k))ans=W?'Bajeti ya taifa 2026/27 ni shilingi trilioni 62 na bilioni 330. Kwa bajeti ya halmashauri yako piga '+FPCODE+' chagua 1.':'The national budget 2026/27 is 62 trillion 330 billion shillings. For your council budget dial '+FPCODE+' and choose 1.';
    else if(/rushwa|takukuru|corrupt|bribe/.test(k))ans=W?'Kuripoti rushwa piga TAKUKURU 113 bure. Hutaombwa jina lako.':'To report corruption call PCCB (TAKUKURU) on 113 for free.';
    else{ans=W?'Bado hatuna jibu lililoidhinishwa la swali hili. Tumelihifadhi ili WAJIBU iongeze jibu. Unaweza kuuliza kuhusu bajeti, ripoti za CAG au rushwa.':'We do not have an approved answer to this yet. We saved it so WAJIBU can add one. You can ask about budgets, CAG reports or corruption.';fpCase(q)}}
  setTimeout(()=>fpSms('WAJIBU','WAJIBU: '+ans.slice(0,300)),SAMPLE?200:1800)}

const MT={'1':'.,?!1','2':'abc2','3':'def3','4':'ghi4','5':'jkl5','6':'mno6','7':'pqrs7','8':'tuv8','9':'wxyz9','0':' 0'};
function fpType(k){const F=S.fp,txt=(F.scr==='compose'||(F.scr==='ussd'&&F.node.input==='text'));
  if(!txt){if(/[0-9*#]/.test(k))F.inp+=k;return}
  if(!MT[k])return;const n=Date.now();
  if(F.mt&&F.mt.k===k&&n-F.mt.t<900){F.mt.i=(F.mt.i+1)%MT[k].length;F.inp=F.inp.slice(0,-1)+MT[k][F.mt.i]}else{F.mt={k,i:0};F.inp+=MT[k][0]}
  F.mt.t=n;F.mt.ch=MT[k];clearTimeout(F.mtT);F.mtT=setTimeout(()=>{F.mt=null;fpDraw()},900)}
function fpGo(id){const F=S.fp,n=fpNode(id);F.node=n;F.inp='';F.mt=null;F.scr='ussd';if(n.end){if(n.sms)setTimeout(()=>fpSms('WAJIBU',n.smsTxt),1400);if(n.after)n.after()}fpDraw()}

function fpKey(k){const F=S.fp,T=fpT();if(!F)return;if(F.out){ivrKey(k);return}
  if(F.call){if(!F.call.on&&(k==='CALL'||k==='L'||k==='OK')){F.call.on=true;F.call.t0=Date.now();fpDraw();if(TTS){try{TTS.speak(F.call.ti+'. '+F.call.bo,{lang:fw()?'sw':'en'})}catch(_){}}return}
    if(k==='END'||k==='R'){try{TTS&&TTS.stop()}catch(_){}F.call=null;F.scr='home';return fpDraw()}return}
  if(k==='END'){F.scr='home';F.dial='';F.inp='';F.mt=null;return fpDraw()}
  switch(F.scr){
  case 'home':if(/^[0-9*#]$/.test(k)){F.scr='dial';F.dial=k}else if(k==='L'){F.scr='inbox';F.sel=-1}else if(k==='R'||k==='OK'){F.scr='pmenu';F.ms=0}return fpDraw();
  case 'pmenu':{let i=null;if(k==='U')F.ms=Math.max(0,(F.ms||0)-1);else if(k==='D')F.ms=Math.min(3,(F.ms||0)+1);else if(k==='L'||k==='OK')i=F.ms||0;else if(/^[1-4]$/.test(k))i=+k-1;else if(k==='R')F.scr='home';
    if(i===0){F.scr='compose';F.inp='';F.from='pmenu'}else if(i===1){F.scr='inbox';F.sel=-1}else if(i===2){F.scr='dial';F.dial=FPCODE;fpDraw();return fpStart()}else if(i===3){F.scr='dial';F.dial=IVRNUM;fpDraw();return ivrStart()}return fpDraw()}
  case 'dial':if(/^[0-9*#]$/.test(k))F.dial+=k;else if(k==='R'){F.dial=F.dial.slice(0,-1);if(!F.dial)F.scr='home'}
    else if(k==='CALL'||k==='L'||k==='OK'){if(F.dial===FPCODE)return fpStart();if(F.dial===IVRNUM)return ivrStart();toast(fw()?`Namba hii haipo kwenye mfano. Piga ${FPCODE} au ${IVRNUM}`:`This number is not in the demo. Dial ${FPCODE} or ${IVRNUM}`,'info');F.dial=''}return fpDraw();
  case 'wait':if(k==='R'){F.scr='home'}return fpDraw();
  case 'ussd':{const n=F.node;if(n.end){if(k==='L'||k==='OK'||k==='R'){F.scr='home'}return fpDraw()}
    if(/^[0-9*#]$/.test(k)){fpType(k);return fpDraw()}
    if(k==='R'){if(F.inp){F.inp=F.inp.slice(0,-1);F.mt=null}else F.scr='home';return fpDraw()}
    if(k==='L'||k==='OK'||k==='CALL'){const nx=n.go(F.inp.trim());if(!nx){F.inp='';toast(T.bad,'err');return fpDraw()}return fpGo(nx)}return}
  case 'inbox':if(k==='U')F.sel=Math.max(-1,F.sel-1);else if(k==='D')F.sel=Math.min(F.sms.length-1,F.sel+1);else if(k==='L'||k==='OK'){if(F.sel===-1){F.scr='compose';F.inp='';F.from='inbox'}else{const m=F.sms[F.sel];m.u=0;if(m.me||m.f==='WAJIBU'){fpOpenChat();return}F.scr='msg'}}else if(k==='R')F.scr='home';return fpDraw();
  case 'chat':if(k==='R'){F.scr='inbox';F.sel=-1}else if(k==='L'||k==='OK'){F.scr='compose';F.inp='';F.from='chat'}else if(k==='U'||k==='D'){const m=$('#fpm');if(m)m.scrollTop+=(k==='D'?50:-50);return}return fpDraw();
  case 'msg':if(k==='R'){F.scr='inbox'}else if(k==='L'){F.scr='compose';F.inp=''}else if(k==='U'||k==='D'){const m=$('#fpm');if(m)m.scrollTop+=(k==='D'?40:-40);return}return fpDraw();
  case 'compose':if(/^[0-9*#]$/.test(k)){if(k==='*'||k==='#')return;fpType(k);return fpDraw()}
    if(k==='R'){if(F.inp){F.inp=F.inp.slice(0,-1);F.mt=null}else{if(F.from==='chat')return fpOpenChat();F.scr=F.from==='pmenu'?'pmenu':'inbox';F.sel=-1}return fpDraw()}

  case 'sent':F.scr='home';return fpDraw()}}

  case 'me2fa':S.me.twofa=!S.me.twofa;toast(S.me.twofa?(sw()?'Namba ya kuingia kwa SMS imewashwa.':'SMS sign-in code turned on.'):(sw()?'Namba ya kuingia kwa SMS imezimwa.':'SMS sign-in code turned off.'),S.me.twofa?'ok':'info');return draw();
  case 'um:0':S.dd=null;S.st='me';S.drawer=false;return draw();
  case 'um:1':S.dd=null;S.st='me';S.drawer=false;draw();{const x=$('#prefs');if(x)x.scrollIntoView({behavior:'smooth',block:'start'})}return;
  case 'um:2':S.dd=null;S.auth='login';S.lg=LG0();log('theme','—');S.log.shift();toast(U2.lgOut);return draw();
  case 'lgeye':{const v=$('#lgP').value;S.lg.pw=!S.lg.pw;draw();const f=$('#lgP');f.value=v;f.focus();return}
  case 'lgforgot':{const e=$('#lgE');if(e&&S.lg.m==='email')S.lg.e=e.value;S.lg.step='forgot';S.lg.err={};draw();$('#fE').focus();return}
  case 'lgsend':{const v=($('#fE').value||'').trim();S.lg.e=v;S.lg.err={};if(!v){S.lg.err.f=U2.lg.fReq;draw();$('#fE').focus();return}S.lg.step='otp';S.lg.at=Date.now()+30000;draw();{const o=$('.otpi');if(o)o.focus()}return}
  case 'lgnewpw':{const a=$('#nP1').value,b=$('#nP2').value;S.lg.err={};if(a.length<8||a!==b){S.lg.err.n=U2.lg.nErr;draw();$('#nP1').focus();return}S.lg.step='form';draw();toast(U2.lg.nDone);{const p=$('#lgP');if(p)p.focus()}return}
  case 'lgback':S.lg.step='form';S.lg.err={};S.lg.busy=false;draw();{const e=$('#lgE');if(e)e.focus()}return;
  case 'lgresend':S.lg.at=Date.now()+30000;toast(U2.lg.sent);return draw();
  case 'lgvia':S.lg.via=S.lg.via==='sms'?'email':'sms';S.lg.at=Date.now()+30000;toast(U2.lg.sent);return draw();
  case 'lgfill':document.querySelectorAll('.otpi').forEach((x,i)=>x.value=String((i*7+4)%10));return otpAuto();
  case 'lgver':return lgVerify();
  case 'lggo':return lgSubmit();
  case 'upload':S.modal='upload';draw();$('#upT').focus();return;
  case 'closemodal':S.modal=null;return draw();
  case 'upsave':{const ti=($('#upT').value||'').trim(),f=$('#upF').files[0];if(!ti){$('#upT').focus();return toast(sw()?'Weka kichwa cha hati.':'Enter a document title.','err')}
    S.docs.unshift({id:'u'+Date.now(),t:ti,m:(f?f.name+' · '+kb2(f.size):'PDF')+' · Neema M.',tp:$('#upTp').value,lg:$('#upLg').value,st:'rev'});S.modal=null;S.draft.upT='';S.kbf='all';log('upload',ti);toast(U2.upDone);return draw()}
  case 'assign':{const c=S.cases.find(c=>c.id===S.sel);c.who=STAFF[(STAFF.indexOf(c.who)+1)%STAFF.length];log('assign',c.who);toast((sw()?'Swali limepewa ':'Assigned to ')+c.who);return draw()}
  case 'sendrep':{const c=S.cases.find(c=>c.id===S.sel);const v=$('#rep').value.trim();if(!v)return;c.done=true;c.reply=v;if(!c.n)push({k:'staff',who:c.who,h:esc(v).replace(/\n/g,'<br>')});log('reply',c.n||'Asha M.');toast(U2.sent);return draw()}
  case 'sendalert':{const ti=(($('#alT')||{}).value??S.draft.alT??U2.alTitle).trim(),bo=(($('#alB')||{}).value??S.draft.alB??U2.alBody).trim(),n=audN();const ch=Object.keys(S.chn).filter(x=>S.chn[x]);
    if(!ti||!bo||!n||!ch.length)return toast(U2.needAud,'err');
    S.alerts.unshift({title:ti,n,ch:ch.map(x=>({sms:'SMS',voice:U2.voiceN,wa:'WhatsApp'})[x]).join(' + ')});log('alert','“'+ti+'”');
    S.alDone={n,ch:S.alerts[0].ch};if(S.aud['Kilosa DC']&&S.chn.sms)setTimeout(()=>fpSms('WAJIBU',('WAJIBU: '+ti+'. '+bo).slice(0,300)),1500);if(S.aud['Kilosa DC']&&S.chn.voice){if(!S.fp)S.fp=fp0();S.fp.call={ti,bo}}if(S.chn.wa&&S.aud['Kilosa DC']&&!S.optout){sendAlertToPhone(ti,bo,S.alSrc);toast(U2.alSent)}else toast(U2.alNoWa,'info');return draw()}
  case 'seealert':S.view='citizen';S.ph='chat';S.full=true;S.unread=0;if(S.alerts[0]){const last=[...S.msgs].reverse().find(m=>m.alert);if(last){S.banner={t:plain(last.title),b:plain(last.h),tm:last.tm};clearTimeout(S._bt);S._bt=setTimeout(()=>{S.banner=null;draw()},6000)}}try{history.replaceState(null,'',' #whatsapp'.trim())}catch(_){}draw();try{window.scrollTo(0,0)}catch(_){}return;
  case 'pvplay':{const v=($('#vpvT')||{}).textContent||'';if(TTS){TTS.speak(v.slice(0,1900)).catch(()=>toast(sw()?'Sauti haipatikani hapa.':'Voice is not available here.'))}else toast(sw()?'Sauti inapatikana kwenye kiungo cha mtandaoni tu.':'Voice is only available on the online link.');return}
  }
  return false}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  if(S.dlm&&!e.target.closest('.dlw')){S.dlm=null;if(!e.target.closest('[data-act],[data-st]'))draw()}
  if(S.dd&&!e.target.closest('.rel')){S.dd=null;if(!e.target.closest('[data-act],[data-st]'))draw()}
  if(S.gq&&!e.target.closest('.gs')&&!e.target.closest('[data-act^="go:"]')){const r=$('#gres');if(r)r.innerHTML=''}
  if(e.target.closest('#fs')){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast(sw()?'Skrini nzima haiwezekani hapa. Bonyeza F11.':'Full screen is not allowed here. Press F11.'))}catch(_){toast('F11')}return}
  if(e.target.closest('#reset')){fresh();S.auth='login';S.lg=LG0();S.used={};startChat();return}
  const v=e.target.closest('[data-v]');if(v){S.view=v.dataset.v;if(S.view==='citizen'&&S.ph==='chat')S.unread=0;S.full=true;try{history.replaceState(null,'',S.view==='staff'?'#dashboard':S.view==='basic'?'#basic-phone':'#whatsapp')}catch(_){}draw();try{window.scrollTo(0,0)}catch(_){}return}
  const l=e.target.closest('[data-l]');if(l){if(S.lang!==l.dataset.l){const st=S.st,vw=S.view;S.lang=l.dataset.l;try{localStorage.setItem('wk-lang',S.lang)}catch(_){}fresh();S.st=st;S.view=vw;S.fp=fp0();startChat()}return}
  const st=e.target.closest('[data-st]');if(st){S.st=st.dataset.st;S.drawer=false;S.dd=null;draw();try{window.scrollTo(0,0)}catch(_){}return}
  const sel=e.target.closest('[data-sel]');if(sel){S.sel=+sel.dataset.sel;draw();return}
  if(e.target.closest('#go')){if((S.draft.chat||'').trim())sendText();else act('mic');return}
  const x=e.target.closest('[data-act]');if(!x)return;const k=x.dataset.act;
  if(x.dataset.demo){S.used[k]=1;x.classList.add('ok');const ti=x.querySelector('i');if(ti)ti.innerHTML=ic('check',14);if(innerWidth<760){S.demo=false;const p=$('#demoP');if(p)p.classList.remove('open')}}
  if(k==='closesheet'||k==='closeov'||k==='closemodal'){if(e.target!==x&&!x.matches('button'))return;if(k==='closesheet'){S.sheet=false;return draw()}}
  if(S.view==='staff'&&staffAct(k)!==false)return;
  act(k)});
document.addEventListener('keydown',e=>{
  if(e.target.id==='lgP'&&e.getModifierState){S.lg.caps=e.getModifierState('CapsLock');const c=$('#caps');if(c)c.hidden=!S.lg.caps}
  if(e.target.classList&&e.target.classList.contains('otpi')){const o=+e.target.dataset.o;if(e.key==='Backspace'&&!e.target.value&&o>0){const p=$(`.otpi[data-o="${o-1}"]`);p.value='';p.focus();e.preventDefault()}
    if(e.key==='Enter'){e.preventDefault();lgVerify()}if(e.key==='ArrowLeft'&&o>0)$(`.otpi[data-o="${o-1}"]`).focus();if(e.key==='ArrowRight'&&o<5)$(`.otpi[data-o="${o+1}"]`).focus()}
  if(e.target.id==='inp'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendText();return}
  if(e.target.id==='cap'&&e.key==='Enter'){e.preventDefault();act('pvsend');return}
  if(e.key==='Escape'){if(S.dd){S.dd=null;draw()}else if(S.modal){S.modal=null;draw()}else if(S.sheet||S.ov&&S.ov!=='call'){S.sheet=false;S.ov=null;S.pv=null;draw()}}});
document.addEventListener('input',e=>{const id=e.target.id,v=e.target.value;
  if(id==='inp'){S.draft.chat=v;fit(e.target);syncGo()}
  else if(id==='lsearch'){S.ls=v;const r=$('#crows');if(r)r.innerHTML=chatRows()}
  else if(id==='kq'){S.kq=v;const r=$('#kbrows');if(r)r.innerHTML=kbRows()}
  else if(id==='tmq'){S.tmq=v;const st=e.target.selectionStart;draw();const x=$('#tmq');if(x){x.focus();x.setSelectionRange(st,st)}}
  else if(id==='audq'){S.audq=v;const r=$('#audl');if(r)r.innerHTML=audList()}
  else if(id==='dbq'){S.dbq=v;const r=$('#dbrows');if(r)r.innerHTML=dbRows()}
  else if(id==='gq'){S.gq=v;const r=$('#gres');if(r)r.innerHTML=resHtml()}
  else if(e.target.classList.contains('otpi')){e.target.value=v.replace(/\D/g,'').slice(-1);const nx=document.querySelector(`.otpi[data-o="${+e.target.dataset.o+1}"]`);if(e.target.value&&nx)nx.focus();otpAuto()}
  else if(id==='rep')S.draft['c'+S.sel]=v;else if(id==='gapA')S.draft.gapA=v;else if(id==='upT')S.draft.upT=v;
  else if(id==='alT'||id==='alB'){if(id==='alT')S.draft.alT=v}if(id==='alB'||id==='alT'||id==='alT'){if(id==='alB')S.draft.alB=v;const c=$('#alc');if(c&&id==='alB')c.textContent=v.length+' '+u().chars+' · '+segs(v.length)+' '+u().smsN;const ti2=$('#alT').value||'',bo2=$('#alB').value||'';const p=$('#smsPrev');if(p)p.textContent=ti2+': '+bo2;[['#wpvT',ti2],['#wpvT2',ti2],['#wpvB',bo2]].forEach(([q,v])=>{const e=$(q);if(e)e.textContent=v});const vv=$('#vpvT');if(vv)vv.textContent=ti2+'. '+bo2}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.trole!=null){const m=S.team[+el.dataset.trole];m.r=+el.value;log('role',m.n+' → '+ROLES()[m.r]);toast((sw()?'Jukumu limebadilishwa: ':'Role updated: ')+m.n);return draw()}
  if(el.id==='upF'){upShow(el.files[0]);return}
  if(el.id==='srcSel'){if(el.value)staffAct('insertsrc');return}
  if(el.dataset&&el.dataset.f){S[el.dataset.f]=el.value;draw();return}
  if(el.id==='dbc'){S.dbc=el.value;const r=$('#dbrows');if(r)r.innerHTML=dbRows();return}
  if(el.dataset&&el.dataset.role!=null){const i=+el.dataset.role;S.users[i][1]=+el.value;log('role',S.users[i][0]+' → '+ROLES()[+el.value]);toast((sw()?'Jukumu limebadilishwa: ':'Role updated: ')+S.users[i][0]);return draw()}
  const f=el.files&&el.files[0];if(!f)return;
  if(el.id==='fPhoto'||el.id==='fCam'){if(!f.type.startsWith('image/'))return toast(t().notImg,'err');S.view='citizen';if(S.ph!=='chat')S.full=true;S.ph='chat';S.sheet=false;S.pv={url:URL.createObjectURL(f),name:f.name};S.ov='preview';draw();return}
  if(el.id==='fDoc'){S.view='citizen';if(S.ph!=='chat')S.full=true;sendDoc(f.name,kb2(f.size))}});
document.addEventListener('submit',e=>{if(e.target.id==='lgform'){e.preventDefault();lgSubmit()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('#lgform')&&e.target.tagName==='INPUT'){e.preventDefault();lgSubmit()}});
document.addEventListener('paste',e=>{if(!(e.target.classList&&e.target.classList.contains('otpi')))return;const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!d)return;e.preventDefault();document.querySelectorAll('.otpi').forEach((x,i)=>x.value=d[i]||'');const n=$(`.otpi[data-o="${Math.min(d.length,5)}"]`);if(n)n.focus();otpAuto()});
document.addEventListener('fullscreenchange',()=>{setFs();setTop()});
function setFs(){const b=$('#fs');if(b)b.innerHTML=ic(document.fullscreenElement?'x':'expand',16)+(document.fullscreenElement?(sw()?'Toka':'Exit'):(sw()?'Skrini nzima':'Full screen'))}
addEventListener('hashchange',()=>{route();S.full=true;draw()});
setInterval(()=>{if(S.view==='staff'&&S.st==='in'&&!(document.activeElement&&document.activeElement.matches('textarea,input,select')))draw()},30000);
try{S.mini=localStorage.getItem('wk-mini')==='1'}catch(_){}
const setTop=()=>{const h=$('.top').offsetHeight,r=document.documentElement.style,av=innerHeight-h-10;r.setProperty('--topH',h+'px');r.setProperty('--ph','896px');r.setProperty('--pz',Math.max(.78,Math.min(1,av/896)).toFixed(3));requestAnimationFrame(()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight})};addEventListener('resize',setTop);
S.lg=LG0();S.demo=false;
fresh();applyTheme();route();startChat();setTop();setFs();setTimeout(setTop,350);
try{const ro=new ResizeObserver(()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight});new MutationObserver(()=>{const c=$('#chat');if(c&&!c._ro){c._ro=1;ro.observe(c)}}).observe(document.body,{childList:true,subtree:true})}catch(_){}
}

/* ---------- custom themed dropdowns (wraps every select.inp) ---------- */
let CS=null;
function cselLabel(sel){const o=sel.options[sel.selectedIndex];return o?o.textContent:''}
function cselEnhance(){document.querySelectorAll('select.inp:not([data-cs])').forEach(sel=>{sel.dataset.cs='1';
  const b=document.createElement('button');b.type='button';b.className='inp csel'+(sel.disabled?' dis':'');b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
  if(sel.getAttribute('style'))b.setAttribute('style',sel.getAttribute('style'));if(sel.id)b.dataset.for=sel.id;
  const lab=sel.getAttribute('aria-label')||(sel.closest('label')&&sel.closest('label').firstChild&&sel.closest('label').firstChild.textContent)||'';if(lab)b.setAttribute('aria-label',lab.trim());
  b.disabled=sel.disabled;b.innerHTML=`<span class="csv"></span><svg class="csc" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;b.querySelector('.csv').textContent=cselLabel(sel);
  b._sel=sel;sel.after(b);sel.classList.add('csh');sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');
  sel.addEventListener('change',()=>{b.querySelector('.csv').textContent=cselLabel(sel)})})}
function cselClose(focus){if(!CS)return;const {b,list}=CS;list.remove();b.setAttribute('aria-expanded','false');b.classList.remove('open');CS=null;if(focus)b.focus()}
function cselOpen(b){cselClose();const sel=b._sel;if(!sel||sel.disabled)return;
  const list=document.createElement('div');list.className='cslist';list.setAttribute('role','listbox');
  [...sel.options].forEach((o,i)=>{const it=document.createElement('div');it.className='csi'+(i===sel.selectedIndex?' on':'');it.setAttribute('role','option');it.setAttribute('aria-selected',i===sel.selectedIndex);it.dataset.i=i;
    it.innerHTML=`<span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`;it.firstChild.textContent=o.textContent;if(o.disabled)it.classList.add('dis');list.appendChild(it)});
  document.body.appendChild(list);b.setAttribute('aria-expanded','true');b.classList.add('open');
  const r=b.getBoundingClientRect(),h=Math.min(list.scrollHeight,300),below=innerHeight-r.bottom;
  list.style.minWidth=r.width+'px';list.style.left=Math.min(r.left,innerWidth-Math.max(r.width,list.offsetWidth)-8)+'px';
  if(below<h+12&&r.top>below){list.style.top=(r.top-h-6)+'px';list.classList.add('up')}else list.style.top=(r.bottom+6)+'px';
  CS={b,list,sel,hi:sel.selectedIndex};cselHi(sel.selectedIndex);
  const on=list.querySelector('.csi.on');if(on)on.scrollIntoView({block:'nearest'})}
function cselHi(i){if(!CS)return;const its=CS.list.querySelectorAll('.csi');i=Math.max(0,Math.min(its.length-1,i));its.forEach(x=>x.classList.remove('hi'));if(its[i]){its[i].classList.add('hi');its[i].scrollIntoView({block:'nearest'})}CS.hi=i}
function cselPick(i){if(!CS)return;const {sel}=CS;cselClose(true);if(sel.selectedIndex!==i){sel.selectedIndex=i;sel.dispatchEvent(new Event('change',{bubbles:true}))}}
document.addEventListener('click',e=>{const it=e.target.closest&&e.target.closest('.csi');if(it&&CS){if(!it.classList.contains('dis'))cselPick(+it.dataset.i);e.stopPropagation();return}
  const b=e.target.closest&&e.target.closest('.csel');if(b){e.stopPropagation();if(CS&&CS.b===b)cselClose(true);else cselOpen(b);return}
  if(CS&&!e.target.closest('.cslist'))cselClose()},true);
document.addEventListener('pointerover',e=>{const it=e.target.closest&&e.target.closest('.csi');if(it&&CS)cselHi(+it.dataset.i)});
document.addEventListener('keydown',e=>{const b=e.target.closest&&e.target.closest('.csel');
  if(CS){if(e.key==='ArrowDown'){e.preventDefault();cselHi(CS.hi+1)}else if(e.key==='ArrowUp'){e.preventDefault();cselHi(CS.hi-1)}else if(e.key==='Home'){e.preventDefault();cselHi(0)}else if(e.key==='End'){e.preventDefault();cselHi(1e3)}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();cselPick(CS.hi)}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cselClose(true)}else if(e.key==='Tab')cselClose();return}
  if(b&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' ')){e.preventDefault();cselOpen(b)}},true);
window.addEventListener('resize',()=>cselClose());document.addEventListener('scroll',e=>{if(CS&&!(e.target.closest&&e.target.closest('.cslist')))cselClose()},true);
new MutationObserver(()=>{cselEnhance();if(CS&&!document.body.contains(CS.b)){CS.list.remove();CS=null}}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',cselEnhance);setTimeout(cselEnhance,0);
</script>
